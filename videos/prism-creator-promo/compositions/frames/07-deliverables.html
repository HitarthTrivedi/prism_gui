  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* -------- Scene 1 (0.0–1.8s) — the research brief rises into the
         lower-middle third on a long-tail settle. The stack carries the
         rise, so the same element can later STEP without a re-layout. */
      tl.fromTo(
        "#dl-stack",
        { y: 486 },
        { y: 396, duration: 1.05, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        "#dl-card-1",
        { opacity: 0 },
        { opacity: 1, duration: 0.42, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        "#dl-eyebrow",

        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.12,

      /* -------- Scene 2 (1.8–3.6s) — the stack STEPS up one slot (one
         motion, not a re-layout) and the scripted outline lands beneath. */
      tl.to("#dl-stack", { y: 196, duration: 0.95, ease: "power3.inOut" }, 1.8);
      tl.fromTo(
        "#dl-card-2",
        { opacity: 0, y: 44 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
        1.95,
      );

      /* -------- Scene 3 (3.6–6.2s) — the stack steps up again; three 16:9
         thumbnail frames snap into a row (spring-pop-entrance, smooth
         power3 settle, no overshoot), staggered by index. */
      tl.to("#dl-stack", { y: 0, duration: 0.95, ease: "power3.inOut" }, 3.6);

      var thumbs = gsap.utils.toArray("#dl-thumb-row .dl-thumb");
      var STAGGER = 0.15; /* 3 x 0.15 = 0.45s — the group lands in one beat */
      thumbs.forEach(function (el, i) {
        tl.fromTo(
          el,
          { scale: 0, opacity: 0, y: 22 },
          { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          4.4 + i * STAGGER,
        );
      });

      /* the cue lands with the third thumbnail */
      tl.fromTo(
        "#dl-strip-head",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        4.7,
      );

      /* -------- Scene 4 (6.2–8.0s) — the payoff lands in teal, then the
         frame holds DEAD STILL. No camera push, no pan, no breath: the
         only aliveness is low-amplitude jitter on the thumbnail row,
         applied to inner wrappers no other tween touches. */
      tl.fromTo(
        "#dl-payoff",
        { opacity: 0, y: 34 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        6.15,
      );

      var inners = gsap.utils.toArray("#dl-thumb-row .dl-thumb-in");
      var IDLE_DUR = 2.4;
      var CYCLES = 1.0; /* period ~2.4s */
      var Y_AMP = 1.6; /* 3px default / sqrt(3) concurrent elements */
      var phase = { p: 0 };
      /* baseline at t=0 so a backwards seek can never keep a stale offset */
      tl.set(inners, { y: 0 }, 0);
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            for (var i = 0; i < inners.length; i++) {
              /* offset phases so the three never move in lockstep */
              var s = Math.sin(phase.p + (i * Math.PI * 2) / 3);
              gsap.set(inners[i], { y: s * Y_AMP });
            }
          },
        },
        5.6,
      );

      window.__timelines["07-deliverables"] = tl;
    })();
