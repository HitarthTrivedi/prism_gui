  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="05-real-plan"]');
      if (!root) return;
      var q = function (sel) {
        return root.querySelector(sel);
      };

      var TOTAL = 7;
      var STEP = 87.23; // exactly one plan row, at the inset's crop scale
      var CUTS = [1.2, 2.4, 3.6, 4.8];
      var STEP_DUR = 0.46;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["05-real-plan"] = tl;

      /* ── elements ───────────────────────────────────────────────────────── */
      var inset = q("#r05-inset");
      var strip = q("#r05-strip");
      var kicker = q("#r05-kicker");
      var countEl = q("#r05-count");
      var ruleTop = q("#r05-rule-top");
      var ruleBot = q("#r05-rule-bot");
      var botChrome = q("#r05-botchrome");
      var cue = q("#r05-cue");
      var cue1 = q("#r05-cue-1");
      var cue2 = q("#r05-cue-2");
      var press = q("#r05-press");
      var chip = q("#r05-chip");
      var chipKey = q("#r05-chip-key");
      var chipLabel = q("#r05-chip-label");
      var burst = q("#r05-burst");
      var bgGlow = q("#r05-bgglow");
      var lead = q("#r05-lead");
      var edges = [q("#r05-edge-1"), q("#r05-edge-2"), q("#r05-edge-3"), q("#r05-edge-4")];
      var glows = Array.prototype.slice.call(root.querySelectorAll(".r05-chipglow"));

      /* ── discrete-text-sequence — whole states swapped at hard thresholds ── */
      var SEQUENCE = [
        { t: 0.0, l1: "", l2: "", key: "", tool: "", band: "#a78bfa", count: "" },
        { t: 1.2, l1: "look things", l2: "up", key: "P", tool: "Perplexity", band: "#a78bfa", count: "01 / 07" },
        { t: 2.4, l1: "think it", l2: "through", key: "C", tool: "ChatGPT", band: "#60a5fa", count: "02 / 07" },
        { t: 3.6, l1: "write it", l2: "up", key: "C", tool: "Claude", band: "#4cd9b4", count: "03 / 07" },
        { t: 4.8, l1: "make the", l2: "images", key: "C", tool: "ChatGPT", band: "#a3e635", count: "04 / 07" }
      ];

      function stateAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      var lastState = null;
      function applyState(time) {
        var s = stateAt(time);
        if (s === lastState) return;
        lastState = s;
        cue1.textContent = s.l1;
        cue2.textContent = s.l2;
        chipKey.textContent = s.key;
        chipLabel.textContent = s.tool;
        countEl.textContent = s.count;
        chip.style.borderLeftColor = s.band;
      }

      /* ── viewport-change — ONE cam object, ONE writer.
         The step is solved from scene time through a single eased piecewise
         function, so the camera is identical at any seek, forward or back.   */
      var stepEase = gsap.parseEase("power3.inOut");
      var cam = { y: 0 };
      function applyCamera() {
        strip.style.transform = "translateY(" + cam.y + "px)";
      }
      function camYAt(time) {
        var y = 0;
        for (var i = 1; i < CUTS.length; i++) {
          var p = (time - CUTS[i]) / STEP_DUR;
          p = p <= 0 ? 0 : p >= 1 ? 1 : stepEase(p);
          y -= STEP * p;
        }
        return y;
      }

      /* ── svg-path-draw — measured lengths, never guessed ─────────────────── */
      var lens = edges.map(function (p) {
        var len = (p.getTotalLength && p.getTotalLength()) || 69.53;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        return len;
      });

      /* ── asr-keyword-glow — ONE linear driver, envelope over every chip ──── */
      var ATTACK_DUR = 0.18;
      var RELEASE = 0.35;
      var REST_LEVEL = 0.15;
      var MAX_BLUR = 24;
      var MAX_SCALE_BOOST = 0.07;
      var TIMINGS = {
        c1: { start: 1.3, end: 2.3 },
        c2: { start: 2.5, end: 3.5 },
        c3: { start: 3.7, end: 4.7 },
        c4: { start: 4.9, end: 6.9 }
      };

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      var driver = { t: 0 };
      function paintGlows() {
        for (var i = 0; i < glows.length; i++) {
          var el = glows[i];
          var timing = TIMINGS[el.dataset.chip];
          if (!timing) continue;
          var env = envelope(driver.t, timing.start, timing.end);
          el.style.opacity = String(env);
          el.style.boxShadow = "0 0 " + MAX_BLUR * env + "px rgba(76, 217, 180, " + 0.85 * env + ")";
          el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
        }
      }
      function paintScene() {
        applyState(driver.t);
        cam.y = camYAt(driver.t);
        applyCamera();
        paintGlows();
      }
      paintScene(); // seed frame 0

      /* ── seek-safe rest states; every later arrival departs from here ────── */
      tl.set([kicker, botChrome, cue, press, lead, countEl], { opacity: 0 }, 0);
      tl.set([ruleTop, ruleBot], { scaleX: 0 }, 0);
      tl.set(inset, { scale: 0.96, opacity: 0 }, 0);
      tl.set(burst, { scale: 1, opacity: 0 }, 0);
      tl.set(bgGlow, { opacity: 0 }, 0);
      tl.set(chip, { scale: 1 }, 0);

      // Every fromTo below is deferred: its from-state must not be stamped onto
      // the DOM at build time, only once the playhead reaches it.
      function to(o) {
        o.immediateRender = false;
        return o;
      }

      /* ── SCENE 1 (0.0–1.2s) · the crop lands ─────────────────────────────── */
      tl.fromTo(ruleTop, { scaleX: 0 }, to({ scaleX: 1, duration: 0.6, ease: "power3.out" }), 0.02);
      tl.fromTo(
        kicker,
        { opacity: 0, x: -26 },
        to({ opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }),
        0.04
      );
      // spring-pop-entrance, restrained: a smooth long-tail settle, no overshoot
      tl.fromTo(
        inset,
        { scale: 0.96, opacity: 0 },
        to({ scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" }),
        0.08
      );
      tl.fromTo(ruleBot, { scaleX: 0 }, to({ scaleX: 1, duration: 0.65, ease: "power3.out" }), 0.5);
      tl.fromTo(
        botChrome,
        { opacity: 0 },
        to({ opacity: 1, duration: 0.45, ease: "power2.out" }),
        0.62
      );

      /* ── SCENES 2–5 · the cue cuts, the edge hands off, the panel steps ──── */
      CUTS.forEach(function (t, i) {
        // The state swap is instant; the block re-enters on the same upward
        // vector the panel is travelling — a velocity-matched seam.
        tl.fromTo(
          cue,
          { opacity: 0, y: 36, filter: "blur(10px)" },
          to({ opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "power3.out" }),
          t
        );
        tl.fromTo(
          press,
          { opacity: i === 0 ? 0 : 0.35, y: i === 0 ? 34 : 16 },
          to({ opacity: 1, y: 0, duration: i === 0 ? 0.46 : 0.34, ease: "power3.out" }),
          t
        );
        if (i === 0) {
          tl.fromTo(
            countEl,
            { opacity: 0 },
            to({ opacity: 1, duration: 0.3, ease: "power2.out" }),
            t
          );
        }
        // the lit teal edge draws DOWN the focused row's left side
        tl.fromTo(
          edges[i],
          { strokeDashoffset: lens[i] },
          to({ strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }),
          t + 0.05
        );
        // …then hands off to the next row. Row 4 holds — it stays lit to the end.
        if (i < 3) {
          tl.fromTo(
            edges[i],
            { strokeDashoffset: 0 },
            to({ strokeDashoffset: lens[i], duration: 0.14, ease: "power2.in" }),
            CUTS[i + 1] - 0.1
          );
        }
      });

      // the single linear driver — scene time in, every per-frame paint out
      tl.to(driver, { t: TOTAL, duration: TOTAL, ease: "none", lazy: false, onUpdate: paintScene }, 0);

      /* ── SCENE 6 (5.8–7.0s) · stepping stops; the chip proves it's a control ─ */
      tl.fromTo(
        lead,
        { opacity: 0, y: 30, filter: "blur(8px)" },
        to({ opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }),
        5.82
      );

      // press-release-spring — linear compression, spring release, adjacent so
      // the release starts exactly where the press ended.
      var PRESS_START = 5.95;
      var PRESS_DUR = 0.16;
      var RELEASE_START = PRESS_START + PRESS_DUR;
      tl.fromTo(
        chip,
        { scale: 1, backgroundColor: "#141618" },
        to({ scale: 0.93, backgroundColor: "#0e1012", duration: PRESS_DUR, ease: "power1.in" }),
        PRESS_START
      );
      tl.fromTo(
        chip,
        { scale: 0.93, backgroundColor: "#0e1012" },
        to({ scale: 1, backgroundColor: "#141618", duration: 0.55, ease: "back.out(1.5)" }),
        RELEASE_START
      );
      tl.fromTo(
        burst,
        { scale: 1, opacity: 0 },
        to({ scale: 3.4, opacity: 0.45, duration: 0.42, ease: "power2.out" }),
        RELEASE_START
      );
      tl.fromTo(
        burst,
        { opacity: 0.45 },
        to({ opacity: 0, duration: 0.38, ease: "power2.in" }),
        RELEASE_START + 0.42
      );
      tl.fromTo(
        bgGlow,
        { opacity: 0 },
        to({ opacity: 0.14, duration: 0.6, ease: "power2.out" }),
        RELEASE_START
      );
      // …then still.
    })();
  </script>
