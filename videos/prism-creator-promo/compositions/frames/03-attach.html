  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var g = window.gsap;
      window.__timelines = window.__timelines || {};
      var tl = g.timeline({ paused: true });
      window.__timelines["03-attach"] = tl;

      var q = function (sel) {
        return document.querySelector(sel);
      };

      var DUR = 8.5;
      var INK = "#0d0f10";
      var TEAL = "#4cd9b4";

      /* ------------------------------------------------------------------
         Scene 1 (0.0-1.6) — the real task-card crop lands as a ui-inset
         panel: restrained scale-up settle from 0.94, smooth, no overshoot
         (spring-pop-entrance, calm-settle variation). Mono kicker above.
      ------------------------------------------------------------------ */
      tl.fromTo(
        "#a3-panel",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.72, ease: "power3.out" },
        0.04
      );

      tl.fromTo(
        "#a3-kicker",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.44
      );

      /* ------------------------------------------------------------------
         Scene 2 (1.6-3.4) — cue "add file", the teal rule draws to a stop
         under the crop's real Add file button (svg-path-draw), then the
         rebuilt file chip rises from the lower right and docks under a
         mono ATTACHED label on a long-tail settle.
      ------------------------------------------------------------------ */
      tl.fromTo(
        "#a3-rule-a",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.6, ease: "power3.out" },
        1.58
      );

      tl.fromTo(
        "#a3-cue-add",
        { opacity: 0, x: -26 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        1.66
      );

      var sweepPath = q("#a3-sweep-path");
      var sweepLen = 252;
      if (sweepPath && sweepPath.getTotalLength) {
        sweepLen = sweepPath.getTotalLength();
      }
      sweepPath.style.strokeDasharray = String(sweepLen);
      sweepPath.style.strokeDashoffset = String(sweepLen);
      tl.to(
        sweepPath,
        { strokeDashoffset: 0, duration: 0.56, ease: "power2.out" },
        1.88
      );

      tl.fromTo(
        "#a3-attached",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        2.42
      );

      tl.fromTo(
        "#a3-chip",
        { opacity: 0, x: 128, y: 336, scale: 0.93 },
        { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.96, ease: "power3.out" },
        2.5
      );

      /* ------------------------------------------------------------------
         Scene 3 (3.4-6.2) — the rebuilt input takes over the placeholder
         line and the ask types on behind a caret (discrete-text-sequence
         + context-sensitive-cursor): four phrase beats, three deliverables
         landing as three separate additions.
      ------------------------------------------------------------------ */
      tl.fromTo(
        "#a3-ask-input",
        { opacity: 0 },
        { opacity: 1, duration: 0.14, ease: "power1.out" },
        3.3
      );

      var BASE = "plan my next collab with @maya";
      var TAIL_1 = BASE + " — research it,";
      var TAIL_2 = TAIL_1 + " script it,";
      var TAIL_3 = TAIL_2 + " make thumbnails";

      var SEQUENCE = [
        { t: 0.0, text: "", color: INK },
        { t: 3.45, text: "", color: INK },
        { t: 3.53, text: "p", color: INK },
        { t: 3.61, text: "pl", color: INK },
        { t: 3.67, text: "pla", color: INK },
        { t: 3.75, text: "plan", color: INK },
        { t: 3.85, text: "plan m", color: INK },
        { t: 3.92, text: "plan my", color: INK },
        { t: 4.02, text: "plan my n", color: INK },
        { t: 4.09, text: "plan my ne", color: INK },
        { t: 4.15, text: "plan my nex", color: INK },
        { t: 4.22, text: "plan my next", color: INK },
        { t: 4.32, text: "plan my next c", color: INK },
        { t: 4.38, text: "plan my next co", color: INK },
        { t: 4.44, text: "plan my next col", color: INK },
        { t: 4.5, text: "plan my next coll", color: INK },
        { t: 4.56, text: "plan my next colla", color: INK },
        { t: 4.62, text: "plan my next collab", color: INK },
        { t: 4.74, text: "plan my next collab w", color: INK },
        { t: 4.8, text: "plan my next collab wi", color: INK },
        { t: 4.86, text: "plan my next collab wit", color: INK },
        { t: 4.92, text: "plan my next collab with", color: INK },
        { t: 5.04, text: "plan my next collab with @", color: TEAL },
        { t: 5.11, text: "plan my next collab with @m", color: TEAL },
        { t: 5.17, text: "plan my next collab with @ma", color: TEAL },
        { t: 5.23, text: "plan my next collab with @may", color: TEAL },
        { t: 5.29, text: BASE, color: TEAL },
        { t: 5.5, text: BASE + " —", color: INK },
        { t: 5.58, text: BASE + " — resear", color: INK },
        { t: 5.66, text: TAIL_1, color: INK },
        { t: 5.82, text: TAIL_1 + " scr", color: INK },
        { t: 5.9, text: TAIL_2, color: INK },
        { t: 6.04, text: TAIL_2 + " make thu", color: INK },
        { t: 6.12, text: TAIL_3, color: TEAL }
      ];

      /* baked at build time — no runtime state, identical at any seek */
      var CHANGE_TIMES = [];
      for (var ci = 1; ci < SEQUENCE.length; ci++) {
        if (SEQUENCE[ci].text !== SEQUENCE[ci - 1].text) {
          CHANGE_TIMES.push(SEQUENCE[ci].t);
        }
      }
      var TYPING_GRACE = 0.14;
      var CARET_IN = 3.3;
      var CARET_OUT = 6.62;

      function entryAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      var askEl = q("#a3-ask");
      var caretEl = q("#a3-caret");

      /* blink phase is added first so it renders before the text driver */
      var blink = { p: 0 };
      tl.to(
        blink,
        { p: Math.PI * 2 * 10, duration: DUR, ease: "none" },
        0
      );

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var entry = entryAt(driver.t);
            askEl.textContent = entry.text;
            caretEl.style.background = entry.color;

            if (driver.t < CARET_IN || driver.t > CARET_OUT) {
              caretEl.style.opacity = "0";
              return;
            }
            var typing = false;
            for (var k = 0; k < CHANGE_TIMES.length; k++) {
              var d = driver.t - CHANGE_TIMES[k];
              if (d >= 0 && d < TYPING_GRACE) {
                typing = true;
                break;
              }
            }
            caretEl.style.opacity = typing
              ? "1"
              : Math.sin(blink.p) > 0
                ? "1"
                : "0";
          }
        },
        0
      );

      /* ------------------------------------------------------------------
         Scene 4 (6.2-8.0) — the crop's Make a plan button lights teal and
         takes a tactile press (press-release-spring: linear compression,
         back.out release, burst behind), with the mono cue landing beside
         it. The frame then holds still.
      ------------------------------------------------------------------ */
      tl.fromTo(
        "#a3-rule-b",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" },
        6.18
      );

      tl.fromTo(
        "#a3-plan-btn",
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" },
        6.26
      );

      tl.fromTo(
        "#a3-cue-plan",
        { opacity: 0, x: 26 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        6.52
      );

      var PRESS_START = 6.78;
      var PRESS_DUR = 0.16;
      var RELEASE_START = PRESS_START + PRESS_DUR;

      tl.to(
        "#a3-plan-btn",
        {
          scale: 0.92,
          backgroundColor: "#37b795",
          borderColor: "#37b795",
          duration: PRESS_DUR,
          ease: "power1.in"
        },
        PRESS_START
      );

      tl.to(
        "#a3-plan-btn",
        {
          scale: 1,
          backgroundColor: "#4cd9b4",
          borderColor: "#4cd9b4",
          duration: 0.56,
          ease: "back.out(1.6)"
        },
        RELEASE_START
      );

      tl.fromTo(
        "#a3-burst",
        { scale: 1, opacity: 0 },
        { scale: 3.2, opacity: 0.5, duration: 0.46, ease: "power2.out" },
        RELEASE_START
      );

      tl.to(
        "#a3-burst",
        { opacity: 0, duration: 0.5, ease: "power2.in" },
        RELEASE_START + 0.46
      );
    })();
  </script>
