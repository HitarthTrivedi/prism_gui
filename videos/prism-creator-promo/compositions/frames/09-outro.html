      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var W = 1080;
      var H = 1920;

      /* ————— Scene 1 (0.0-1.2s) — the stage clears off all four edges.
         Each element's exit direction is derived from its own position:
         the nearest edge wins, on a long-tail settle, staggered by index. ————— */
      all(".f09-outro-res").forEach(function (el, i) {
        var cx = parseFloat(el.getAttribute("data-cx"));
        var cy = parseFloat(el.getAttribute("data-cy"));
        var nx = (cx - W / 2) / (W / 2);
        var ny = (cy - H / 2) / (H / 2);
        var dx = 0;
        var dy = 0;
        if (Math.abs(nx) > Math.abs(ny)) {
          dx = nx < 0 ? -1320 : 1320;
        } else {
          dy = ny < 0 ? -1420 : 1420;
        }
        tl.fromTo(
          el,
          { x: 0, y: 0, opacity: 1 },
          {
            x: dx,
            y: dy,
            opacity: 0,
            duration: 1.02,
            ease: "power2.in",
          },
          0.03 + i * 0.075

      });

      /* ————— Scene 2 (1.2-2.6s) — the mark draws itself on, stroke by stroke.
         Dash lengths are measured geometry, never magic numbers. ————— */
      var segs = all(".f09-outro-seg");
      var SEG = [
        { start: 1.2, dur: 0.22 },
        { start: 1.36, dur: 0.44 },
        { start: 1.68, dur: 0.2 },
        { start: 1.83, dur: 0.38 },
      ];
      segs.forEach(function (p, i) {
        var len = 0;
        if (typeof p.getTotalLength === "function") {
          try {
            len = p.getTotalLength();
          } catch (e) {
            len = 0;
          }
        }
        if (!len || !isFinite(len)) len = parseFloat(p.getAttribute("data-len"));
        len = len * 1.02;
        gsap.set(p, { strokeDasharray: len, strokeDashoffset: len, opacity: 0 });
        /* a fully-offset dash still renders its round cap as a dot, so each
           segment stays hidden until the pen touches down on it. */
        tl.set(p, { opacity: 1 }, SEG[i].start);
        tl.fromTo(
          p,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: SEG[i].dur, ease: "power2.out" },
          SEG[i].start
        );
      });

      /* the drawn segments hand off to the real brand outline on the frame the
         pen lifts — identical geometry, so the swap is invisible and the held
         mark carries the mark's own mitred joins. */
      var strokes = one(".f09-outro-strokes");
