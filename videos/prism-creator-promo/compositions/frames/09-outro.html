  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="09-outro"]');
      if (!root || !window.gsap) return;
      var all = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };
      var one = function (sel) {
        return root.querySelector(sel);
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var W = 1080;
      var H = 1920;

      /* ————— Scene 1 (0.0-1.2s) — the stage clears off all four edges.
         Each element's exit direction is derived from its own position:
         the nearest edge wins, on a long-tail settle, staggered by index. ————— */
      all(".f09-outro-res").forEach(function (el, i) {
        var cx = parseFloat(el.getAttribute("data-cx"));
        var cy = parseFloat(el.getAttribute("data-cy"));
        var nx = (cx - W / 2) / (W / 2);
        var ny = (cy - H / 2) / (H / 2);
        var dx = 0;
        var dy = 0;
        if (Math.abs(nx) > Math.abs(ny)) {
          dx = nx < 0 ? -1320 : 1320;
        } else {
          dy = ny < 0 ? -1420 : 1420;
        }
        tl.fromTo(
          el,
          { x: 0, y: 0, opacity: 1 },
          {
            x: dx,
            y: dy,
            opacity: 0,
            duration: 1.02,
            ease: "power2.in",
          },
          0.03 + i * 0.075
        );
      });

      /* ————— Scene 2 (1.2-2.6s) — the mark draws itself on, stroke by stroke.
         Dash lengths are measured geometry, never magic numbers. ————— */
      var segs = all(".f09-outro-seg");
      var SEG = [
        { start: 1.2, dur: 0.22 },
        { start: 1.36, dur: 0.44 },
        { start: 1.68, dur: 0.2 },
        { start: 1.83, dur: 0.38 },
      ];
      segs.forEach(function (p, i) {
        var len = 0;
        if (typeof p.getTotalLength === "function") {
          try {
            len = p.getTotalLength();
          } catch (e) {
            len = 0;
          }
        }
        if (!len || !isFinite(len)) len = parseFloat(p.getAttribute("data-len"));
        len = len * 1.02;
        gsap.set(p, { strokeDasharray: len, strokeDashoffset: len, opacity: 0 });
        /* a fully-offset dash still renders its round cap as a dot, so each
           segment stays hidden until the pen touches down on it. */
        tl.set(p, { opacity: 1 }, SEG[i].start);
        tl.fromTo(
          p,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: SEG[i].dur, ease: "power2.out" },
          SEG[i].start
        );
      });

      /* the drawn segments hand off to the real brand outline on the frame the
         pen lifts — identical geometry, so the swap is invisible and the held
         mark carries the mark's own mitred joins. */
      var strokes = one(".f09-outro-strokes");
      var outline = one(".f09-outro-outline");
      gsap.set(strokes, { opacity: 1 });
      gsap.set(outline, { opacity: 0 });
      tl.set(strokes, { opacity: 0 }, 2.21);
      tl.set(outline, { opacity: 1 }, 2.21);

      /* then the five facets fill in, staggered along the teal ramp */
      all(".f09-outro-facet").forEach(function (f, i) {
        tl.fromTo(
          f,
          { fillOpacity: 0 },
          { fillOpacity: 1, duration: 0.3, ease: "power1.out" },
          2.18 + i * 0.07
        );
      });

      /* ambient-glow-bloom, form A (bloom-and-hold): one soft bloom behind the
         mark, landing on the mark's settle. No breathe — this lockup holds dead
         still. Peak stays well under the 0.45 ceiling. */
      tl.fromTo(
        ".f09-outro-glow",
        { opacity: 0, scale: 0.86 },
        { opacity: 0.3, scale: 1, duration: 1.05, ease: "power2.out" },
        1.55
      );

      /* ————— Scene 3 (2.6-3.8s) — the wordmark completes the lockup,
         letter-group by letter-group, on a smooth settle. ————— */
      all(".f09-outro-glyph").forEach(function (g, i) {
        tl.fromTo(
          g,
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
          2.68 + i * 0.09
        );
      });

      /* the stub rule bridges the lockup into the closing line */
      tl.fromTo(
        ".f09-outro-rule",
        { opacity: 0, scaleX: 0, transformOrigin: "50% 50%" },
        { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" },
        3.62
      );

      /* ————— Scene 4 (3.8-5.0s) — three clauses, three beats, then the
         lockup holds dead still to the last rendered frame. ————— */
      all(".f09-outro-beat").forEach(function (b, i) {
        tl.fromTo(
          b,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" },
          3.88 + i * 0.2
        );
      });

      window.__timelines["09-outro"] = tl;
    })();
  </script>
