  <script>
    (function () {
      var FRAME_ID = "08-your-chrome";
      var DUR = 6;
      var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ------------------------------------------------------------------
         SCENE 1 (0.0–1.6s) — ink ground; the browser outline DRAWS ITSELF on
         (svg-path-draw), the panel body fills in behind it, and a miniature
         of Frame 4's four lit bands fades up inside. Cue 1 lands beneath.
      ------------------------------------------------------------------ */

      // chrome hairline settles first, quietly
      tl.fromTo(
        q(".f08-your-chrome-chrome"),
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power1.out" },
        0,
      );

      // svg-path-draw — dasharray/dashoffset from the MEASURED path length
      var LEN = {};
      qa(".f08-your-chrome-outline path").forEach(function (p) {
        var len = 0;
        if (typeof p.getTotalLength === "function") len = p.getTotalLength();
        if (!len || !isFinite(len)) len = Number(p.getAttribute("data-len"));
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        LEN[p.id] = len;
      });

      // staggered at ~70–80% of the previous segment: one continuous pen trace.
      // fromTo (never to) so any seek order resolves to the same dashoffset.
      function drawSeg(id, at, dur) {
        var el = q("#" + id);
        tl.fromTo(
          el,
          { strokeDashoffset: LEN[id] },
          { strokeDashoffset: 0, duration: dur, ease: "power2.out" },
          at,
        );
      }
      drawSeg("f08-your-chrome-seg-top", 0.15, 0.45);
      drawSeg("f08-your-chrome-seg-rb", 0.5, 0.62);
      drawSeg("f08-your-chrome-seg-left", 0.98, 0.34);
      // the ONE hairline top bar — no traffic lights, no tabs, no scrollbar
      drawSeg("f08-your-chrome-seg-bar", 1.16, 0.3);

      // draw-then-fill: the window body only appears once the stroke has landed
      tl.fromTo(
        q("#f08-your-chrome-fill"),
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power1.out" },
        1.0,
      );

      // the prompt line the pipeline refracts from (Frame 4's carrier, miniaturised)
      tl.fromTo(
        q("#f08-your-chrome-seed"),
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", transformOrigin: "50% 50%" },
        1.05,
      );
      tl.fromTo(
        q("#f08-your-chrome-promptline"),
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.42, ease: "power2.out", transformOrigin: "0% 50%" },
        1.08,
      );

      // the four lit bands fade up inside, labels intact
      tl.fromTo(
        qa(".f08-your-chrome-bandrow"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out", stagger: 0.08 },
        1.12,
      );

      // cue 1
      tl.fromTo(
        q("#f08-your-chrome-cue1"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.1,
      );

      /* ------------------------------------------------------------------
         SCENE 2 (1.6–3.0s) — cue 2 TYPES into the outline's top bar in mono.
         discrete-text-sequence (sparse states, reverse-searched) +
         context-sensitive-cursor (caret hue follows the active segment).
         The only motion in this window.
      ------------------------------------------------------------------ */

      var MAIN = "#9aa0a6";
      var YOU = "#4cd9b4";

      var SEQUENCE = [
        { t: 0.0, text: "", color: MAIN },
        { t: 1.6, text: "", color: MAIN },
        { t: 1.7, text: "s", color: MAIN },
        { t: 1.77, text: "si", color: MAIN },
        { t: 1.84, text: "sig", color: MAIN },
        { t: 1.91, text: "sign", color: MAIN },
        { t: 1.99, text: "signe", color: MAIN },
        { t: 2.06, text: "signed", color: MAIN },
        { t: 2.2, text: "signed ", color: MAIN },
        { t: 2.28, text: "signed i", color: MAIN },
        { t: 2.35, text: "signed in", color: MAIN },
        { t: 2.52, text: "signed in ", color: MAIN },
        { t: 2.6, text: "signed in a", color: MAIN },
        { t: 2.67, text: "signed in as", color: MAIN },
        { t: 2.78, text: "signed in as ", color: YOU },
        { t: 2.85, text: "signed in as y", color: YOU },
        { t: 2.9, text: "signed in as yo", color: YOU },
        { t: 2.96, text: "signed in as you", color: YOU },
      ];

      function entryAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      // baked at build time — no mutable tracker, so reverse seeks match forward ones
      var CHANGE_TIMES = SEQUENCE.filter(function (e, i) {
        return i > 0 && e.text !== SEQUENCE[i - 1].text;
      }).map(function (e) {
        return e.t;
      });
      var TYPING_GRACE = 0.18;
      var CARET_ON = 1.58;

      var barTextEl = q("#f08-your-chrome-bartext");
      var caretEl = q("#f08-your-chrome-caret");

      var typeDriver = { t: 0 };
      tl.to(
        typeDriver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var entry = entryAt(typeDriver.t);
            barTextEl.textContent = entry.text;
            caretEl.style.background = entry.color;
          },
        },
        0,
      );

      // deterministic square-wave blink — 8 whole cycles across the 6s window
      var blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 8,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            if (typeDriver.t < CARET_ON) {
              caretEl.style.opacity = "0";
              return;
            }
            var typing = false;
            for (var i = 0; i < CHANGE_TIMES.length; i++) {
              var d = typeDriver.t - CHANGE_TIMES[i];
              if (d >= 0 && d < TYPING_GRACE) {
                typing = true;
                break;
              }
            }
            caretEl.style.opacity = typing ? "1" : Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        0,
      );

      tl.fromTo(
        q("#f08-your-chrome-bar"),
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "power1.out" },
        1.52,
      );

      /* ------------------------------------------------------------------
         SCENES 3 & 4 — one tempo grid (kinetic-beat-slam): every remaining
         onset reads its time off PULSE, never a hand-tuned offset.
      ------------------------------------------------------------------ */

      var PULSE = 0.64;
      var BEATS = [3.02, 3.02 + PULSE * 2, 3.02 + PULSE * 3]; // 3.02 / 4.30 / 4.94
      var WORD_STEP = PULSE / 10;

      // SCENE 3 (3.0–4.3s) — cue 3 slams in, teal, single beat, hard cut.
      tl.fromTo(
        q("#f08-your-chrome-cue3"),
        { opacity: 0, scale: 1.32, filter: "blur(14px)", transformOrigin: "0% 50%" },
        {
          opacity: 1,
          scale: 1,
          filter: "blur(0px)",
          transformOrigin: "0% 50%",
          duration: 0.42,
          ease: "power4.out",
        },
        BEATS[0],
      );

      // SCENE 4 (4.3–6.0s) — cue 4, two-part per-word staggered reveal,
      // split at the em-dash.
      tl.fromTo(
        qa("#f08-your-chrome-lineA .f08-your-chrome-w"),
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: WORD_STEP },
        BEATS[1],
      );
      tl.fromTo(
        qa("#f08-your-chrome-lineB .f08-your-chrome-w"),
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.4, ease: "circ.out", stagger: WORD_STEP },
        BEATS[2],
      );

      /* asr-keyword-glow — "drives" activates as if spoken. ONE linear driver
         loops every participating word; the glow hugs the glyph (text-shadow),
         and the envelope decays to a rest breadcrumb rather than to zero.
         Runs on the inner .wt span so it never fights the entrance transform. */
      var ATTACK_DUR = 0.18;
      var RELEASE = 0.28;
      var REST_LEVEL = 0.3;
      var MAX_BLUR = 22;
      var MAX_SCALE_BOOST = 0.06;
      var REST_RGB = { r: 242, g: 242, b: 243 };
      var PEAK_RGB = { r: 76, g: 217, b: 180 };

      var TIMINGS = { drives: { start: 5.1, end: 5.42 } };

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }
      function lerpChannel(a, b, t) {
        return Math.round(a + (b - a) * t);
      }
      function colorAt(env) {
        return (
          "rgb(" +
          lerpChannel(REST_RGB.r, PEAK_RGB.r, env) +
          ", " +
          lerpChannel(REST_RGB.g, PEAK_RGB.g, env) +
          ", " +
          lerpChannel(REST_RGB.b, PEAK_RGB.b, env) +
          ")"
        );
      }

      var glowWords = qa(".f08-your-chrome-wt[data-word]");
      var glowDriver = { t: 0 };
      tl.to(
        glowDriver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            for (var i = 0; i < glowWords.length; i++) {
              var el = glowWords[i];
              var timing = TIMINGS[el.getAttribute("data-word")];
              if (!timing) continue;
              var env = envelope(glowDriver.t, timing.start, timing.end);
              el.style.textShadow = "0 0 " + MAX_BLUR * env + "px rgba(76, 217, 180, " + 0.85 * env + ")";
              el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
              el.style.color = colorAt(env);
            }
          },
        },
        0,
      );

      // …and then it holds. No breath, no jitter — the stillness IS the beat.

      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
