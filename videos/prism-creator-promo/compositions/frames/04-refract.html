  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var CREAM = "#F2F2F3";
      var CREAM_HINT = "#5B6166";

      var root = document.querySelector('[data-composition-id="04-refract"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };

      /* ── Scene 1 (0.0–1.2s) — the input returns ─────────────────────── */
      tl.fromTo(
        [q(".r4-chrome-l"), q(".r4-chrome-r")],
        { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.06 },
        0,
      );
      tl.fromTo(
        "#r4-chrome-bar",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.06,
      );
      tl.fromTo(
        "#r4-kicker",
        { opacity: 0, x: -18 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        0.1,
      );
      tl.fromTo(
        "#r4-ask",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.16,
      );
      // the white prompt line wipes in left→right — the light before the prism
      tl.fromTo(
        "#r4-promptline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.44, ease: "power3.out" },
        0.34,
      );
      // the beam drops out of the line into the vertex
      tl.fromTo(
        "#r4-beam",
        { scaleY: 0, opacity: 1 },
        { scaleY: 1, duration: 0.2, ease: "power2.out" },
        0.58,
      );
      // faceted vertex settles beneath the line
      tl.fromTo(
        "#r4-vertex-inner",
        { opacity: 0, scale: 0.55, rotation: -9, transformOrigin: "50% 50%" },
        {
          opacity: 1,
          scale: 1,
          rotation: 0,
          duration: 0.56,
          ease: "power3.out",
        },
        0.62,
      );

      /* ── Scene 2 (1.2–4.6s) — center-outward expansion ────────────────
         Every band shares ONE origin: the vertex. Each carries its final
         offset from that origin; the entry tweens y from a partially-spread
         start (7 items — the rule's pile-up guard) out to 0, while scaleX
         wipes the beam open to the full-bleed band. Staggered by plan index,
         long-tail settle. */
      var VERTEX_Y = 620; // centre of the faceted vertex, in stage px
      var ENTRY_AT = 1.2;
      var STAGGER = 0.35;
      var EXPAND_DUR = 1.05;
      var START_PROGRESS = 0.16;

      var bands = qa(".r4-band");

      bands.forEach(function (band, i) {
        var top = parseFloat(band.style.top);
        var centreY = top + 49; // band is 98px tall
        var targetY = centreY - VERTEX_Y; // final offset from the shared origin
        band.setAttribute("data-target-y", String(targetY));

        var at = ENTRY_AT + i * STAGGER;

        tl.fromTo(
          band,
          {
            y: -targetY * (1 - START_PROGRESS),
            scaleX: 0.14,
            scaleY: 0.34,
          },
          {
            y: 0,
            scaleX: 1,
            scaleY: 1,
            duration: EXPAND_DUR,
            ease: "power4.out",
          },
          at,
        );
        // a wipe, not a fade-in-as-a-set: opacity resolves in the first beat
        tl.fromTo(
          band,
          { opacity: 0 },
          { opacity: 1, duration: 0.2, ease: "power1.out" },
          at,
        );
        // the label lands just after its band — the stage names itself
        tl.fromTo(
          [
            band.querySelector(".r4-num"),
            band.querySelector(".r4-label"),
            band.querySelector(".r4-marker"),
          ],
          { opacity: 0, x: 20 },
          {
            opacity: 1,
            x: 0,
            duration: 0.38,
            ease: "power3.out",
            stagger: 0.05,
          },
          at + 0.26,
        );
      });

      /* ── Scene 3 (4.6–6.6s) — three bands switch off ──────────────────
         The four survivors do not move: each off band collapses its own fill
         about its own centre, so nothing re-flows. Markers flip state as a
         discrete text sequence; the off rows recede under depth-of-field. */
      var offBands = qa(".r4-band.is-off");
      var OFF_AT = [4.8, 5.1, 5.4];
      var COLLAPSE_DUR = 0.75;
      var BLUR_PER_DEPTH = 1.6;
      var DIM_LEVEL = 0.7;

      offBands.forEach(function (band, i) {
        var at = OFF_AT[i];
        var depth = Number(band.getAttribute("data-depth")) || 1;

        // fill desaturates to cream-hint and collapses to a hairline
        tl.to(
          band.querySelector(".r4-fill"),
          {
            backgroundColor: CREAM_HINT,
            scaleY: 0.032,
            duration: COLLAPSE_DUR,
            ease: "power2.inOut",
          },
          at,
        );
        // label + numeral + marker step up off the hairline and go neutral —
        // the stage stays NAMED even switched off
        tl.to(
          [band.querySelector(".r4-num"), band.querySelector(".r4-label")],
          {
            color: CREAM,
            y: -24,
            duration: COLLAPSE_DUR,
            ease: "power2.inOut",
          },
          at,
        );
        tl.to(
          band.querySelector(".r4-marker"),
          {
            color: CREAM,
            borderColor: CREAM_HINT,
            y: -24,
            scale: 0.82,
            duration: COLLAPSE_DUR,
            ease: "power2.inOut",
          },
          at,
        );
        // depth-of-field: the off rows blur back by depth and dim; the four
        // lit bands hold --dof: 0 and sit above them
        tl.to(
          band,
          {
            "--dof": BLUR_PER_DEPTH * depth + "px",
            opacity: DIM_LEVEL,
            duration: 0.8,
            ease: "power2.inOut",
          },
          at,
        );
      });

      // focal pull — the input that started it all recedes as the plan lands
      tl.to(
        "#r4-header-inner",
        { "--dof": "3px", opacity: 0.5, duration: 0.8, ease: "power2.inOut" },
        4.8,
      );
      tl.to(
        "#r4-vertex-inner",
        { "--dof": "2px", opacity: 0.6, duration: 0.8, ease: "power2.inOut" },
        4.8,
      );

      /* discrete-text-sequence — the include markers flip ON → OFF at
         thresholds, reverse-searched every frame, no tween between states.
         The driver spans the whole frame so every seek (forward or back)
         resolves the same state. */
      var MARK_DRIVER_DUR = 8;
      var SEQUENCES = offBands.map(function (band, i) {
        return {
          el: band.querySelector(".r4-marker"),
          states: [
            { t: 0, text: "ON" },
            { t: OFF_AT[i] - 0.08, text: "OFF" },
          ],
        };
      });
      function textAt(states, time) {
        for (var i = states.length - 1; i >= 0; i--) {
          if (time >= states[i].t) return states[i].text;
        }
        return states[0].text;
      }
      var markDriver = { t: 0 };
      tl.to(
        markDriver,
        {
          t: MARK_DRIVER_DUR,
          duration: MARK_DRIVER_DUR,
          ease: "none",
          onUpdate: function () {
            for (var i = 0; i < SEQUENCES.length; i++) {
              SEQUENCES[i].el.textContent = textAt(
                SEQUENCES[i].states,
                markDriver.t,
              );
            }
          },
        },
        0,
      );

      /* ── Scene 4 (6.6–8.0s) — the count-out, then a held read ─────────── */
      tl.fromTo(
        "#r4-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: "power3.out" },
        6.66,
      );
      tl.fromTo(
        "#r4-foot-line",
        { opacity: 0, x: -26 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        6.74,
      );

      // the four lit bands hold — a bare refraction shimmer, ~1.4px, no more.
      // Spans the whole frame with the amplitude gated to the hold window, so
      // the value is a pure function of the clock at any seek.
      var litFills = qa(".r4-band.is-lit .r4-fill");
      var SHIMMER_AT = 6.6;
      var shimmer = { t: 0 };
      tl.to(
        shimmer,
        {
          t: 8,
          duration: 8,
          ease: "none",
          onUpdate: function () {
            var local = shimmer.t - SHIMMER_AT;
            var amp = local > 0 ? 1.4 : 0;
            for (var i = 0; i < litFills.length; i++) {
              gsap.set(litFills[i], {
                x: amp * Math.sin(local * 4.5 + i * 0.9),
              });
            }
          },
        },
        0,
      );

      window.__timelines["04-refract"] = tl;
    })();
  </script>
