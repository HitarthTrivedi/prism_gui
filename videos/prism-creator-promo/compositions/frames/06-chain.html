      /* ── per-word split (deterministic, built once) ───────────────── */
      function splitWords(rowEl, markTimecode) {
        var words = rowEl.textContent.trim().split(/\s+/);
        rowEl.textContent = "";
        var spans = [];
        for (var i = 0; i < words.length; i++) {
          var s = document.createElement("span");

          s.textContent = words[i];
          rowEl.appendChild(s);
          if (i < words.length - 1)

          spans.push(s);
        }
        if (markTimecode && spans.length) spans[0].className += " f06-chain-tc";
        return spans;
      }

          q(id).querySelectorAll(".f06-chain-row"),

          var dur = SEQ_BASE + t.length * SEQ_PER_CHAR + SEQ_HOLD;
          var start = cumulative;
          cumulative += dur;
          return { start: start, end: cumulative, dur: dur };
