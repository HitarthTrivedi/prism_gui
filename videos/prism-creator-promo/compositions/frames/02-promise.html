    /* --- the refraction fan -------------------------------------------------
       The refraction runs TOP → BOTTOM, which is what the vertical frame wants.
       The white line stops at the vertex (540, 540); the four stage bands
       radiate out of that single point and each lands in its OWN horizontal
       lane, 202px apart. The label sits inside its lane, so two stage names can

    .f02-promise-fan {

    .f02-promise-band {
      position: absolute;
      left: 0;

      inset: 0;

    .f02-promise-bandlabel {

    /* --- the closing lead line -------------------------------------------- */
    .f02-promise-line3 {

    .f02-promise-l3row {

    .f02-promise-w {

      text-shadow: 0 0 0 rgba(76, 217, 180, 0);
    }
    .f02-promise-dash {

        <span data-hf-id="hf-s2vs" class="f02-promise-w" data-half="1" data-word="b-out"><span data-hf-id="hf-bm59" class="f02-promise-g">out.</span></span>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var SCENE_DURATION = 6;

      var root = document.querySelector('[data-composition-id="02-promise"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };

      /* ================================================================
         ONE tempo grid drives every beat (kinetic-beat-slam).
         ================================================================ */
      var PULSE = 0.35;
      var BEAT_BEAM = 0; // scene 1 — the white line draws in
      var BEAT_CUE1 = PULSE * 1; // 0.35  scene 1 — "one prompt."
      var BEAT_CUE2 = PULSE * 4; // 1.40  scene 2 — "one pipeline."
      var BEAT_FAN = PULSE * 5; // 1.75  scene 2 — the refraction
      var BEAT_LEAD = PULSE * 8; // 2.80  scene 3 — the lead line
      var BEAT_GLOW = PULSE * 13; // 4.55  scene 4 — the keyword glow

      /* ================================================================
         SCENE 1 (0.0–1.3s) — svg-path-draw: the white light arrives.
         Dash pattern from the measured getTotalLength(), never a guess.
         ================================================================ */
      var beam = q(".f02-promise-beam");
      var beamLen = beam.getTotalLength() || 540; // measured; 540 = the authored geometry
      beam.style.strokeDasharray = String(beamLen);
      beam.style.strokeDashoffset = String(beamLen);
      tl.fromTo(
        beam,
        { strokeDashoffset: beamLen },
        { strokeDashoffset: 0, duration: 0.95, ease: "power2.out" },
        BEAT_BEAM,
      );

      /* kinetic-beat-slam — entrance 1: scale + blur slam (power4.out) */
      tl.fromTo(
        q(".f02-promise-cue1"),
        { scale: 1.5, filter: "blur(16px)", opacity: 0 },
        {
          scale: 1,
          filter: "blur(0px)",
          opacity: 1,
          duration: 0.45,
          ease: "power4.out",
        },
        BEAT_CUE1,
      );

      /* ================================================================
         SCENE 2 (1.3–2.8s) — cue 2 lands, then the line refracts.
         ================================================================ */

      /* kinetic-beat-slam — entrance 2: side snap on a different axis (expo.out) */
      tl.fromTo(
        q(".f02-promise-cue2"),
        { x: -340, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" },
        BEAT_CUE2,
      );

      /* center-outward-expansion — every band shares ONE origin: the vertex at
         (540, 540) where the white line stops. Each band carries its final
         offset from that point and travels the full distance out to its own
         horizontal lane, top to bottom, staggered by plan index, out-eases only
         and a long tail on the settle. The wrapper carries the travel; the fill
         carries the wipe (opening outward from the vertex x), so the stage name
         inside is never stretched. Never a fade-in-as-a-set. */
      var VERTEX_Y = 540; // the y of the white prompt line = the vertex
      var BAND_H = 170; // must match .f02-promise-band height
      var BAND_STAGGER = 0.1;
      var BAND_DUR = 1.15;
      var bands = qa(".f02-promise-band");
      bands.forEach(function (band, i) {
        var laneCentre = parseFloat(band.style.top) + BAND_H / 2;
        var targetY = laneCentre - VERTEX_Y; // final offset from the shared origin
        var at = BEAT_FAN + i * BAND_STAGGER;

        tl.fromTo(
          band,
          { y: -targetY },
          { y: 0, duration: BAND_DUR, ease: "expo.out" },
          at,
        );
        /* a wipe, not a fade of the set: opacity resolves inside the first beat */
        tl.fromTo(band, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, at);
        tl.fromTo(
          band.querySelector(".f02-promise-bandfill"),
          { scaleX: 0.02, scaleY: 0.06 },
          { scaleX: 1, scaleY: 1, duration: BAND_DUR, ease: "expo.out" },
          at,
        );
        /* the stage name reads in only once its band has reached its lane */
        tl.fromTo(
          band.querySelector(".f02-promise-bandlabel"),
          { opacity: 0, x: -26 },
          { opacity: 1, x: 0, duration: 0.36, ease: "power3.out" },
          at + 0.58,
        );
      });

      /* ================================================================
         SCENE 3 (2.8–4.6s) — dynamic-content-sequencing: per-word reveal,
         windows derived from word length, pre-computed ONCE at build.
         The two halves are cued either side of the em-dash.
         ================================================================ */
      var BASE_DURATION = 0.07;
      var SEC_PER_CHAR = 0.014;
      var HALF_GAP = 0.16; // the beat between the two halves of the line
      var REVEAL_DUR = 0.38;

      var words = qa(".f02-promise-w");
      var cumulative = BEAT_LEAD;
      var lastHalf = "0";
      var LEAD_TIMELINE = words.map(function (el) {
        if (el.dataset.half !== lastHalf) {
          cumulative += HALF_GAP;
          lastHalf = el.dataset.half;
        }
        var dur = BASE_DURATION + el.textContent.length * SEC_PER_CHAR;
        var start = cumulative;
        cumulative += dur;
        return { el: el, start: start, end: cumulative };
      });

      /* kinetic-beat-slam — entrance 3: a rise on a third axis (power3.out) */
      LEAD_TIMELINE.forEach(function (entry) {
        tl.fromTo(
          entry.el,
          { y: 28, opacity: 0 },
          { y: 0, opacity: 1, duration: REVEAL_DUR, ease: "power3.out" },
          entry.start,
        );
      });

      /* ================================================================
         SCENE 4 (4.6–6.0s) — asr-keyword-glow lands ONCE on the payoff
         half, in teal; then the frame resolves. One linear driver sweeps
         scene time and writes every word's envelope — never one tween per
         word. Ease stays "none" or the envelopes warp.
         ================================================================ */
      var ATTACK_DUR = 0.1;
      var RELEASE = 0.3;
      var REST_LEVEL = 0.45;
      var MAX_BLUR = 22;
      var MAX_SCALE_BOOST = 0.07;

      var REST_RGB = { r: 242, g: 242, b: 243 }; // cream
      var ACTIVE_RGB = { r: 76, g: 217, b: 180 }; // teal — the lone accent

      /* monotonic, non-overlapping; the final word holds ~1.7× a normal window */
      var TIMINGS = {
        "b-your": { start: BEAT_GLOW, end: BEAT_GLOW + 0.12 },
        "b-next": { start: BEAT_GLOW + 0.14, end: BEAT_GLOW + 0.26 },
        "b-collab": { start: BEAT_GLOW + 0.28, end: BEAT_GLOW + 0.43 },
        "b-out": { start: BEAT_GLOW + 0.45, end: BEAT_GLOW + 0.65 },
      };

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      function lerpChannel(a, b, t) {
        return Math.round(a + (b - a) * t);
      }
      function colorAt(env) {
        return (
          "rgb(" +
          lerpChannel(REST_RGB.r, ACTIVE_RGB.r, env) +
          ", " +
          lerpChannel(REST_RGB.g, ACTIVE_RGB.g, env) +
          ", " +
          lerpChannel(REST_RGB.b, ACTIVE_RGB.b, env) +
          ")"
        );
      }

      var glowWords = qa(".f02-promise-w[data-word]");
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: SCENE_DURATION,
          duration: SCENE_DURATION,
          ease: "none",
          onUpdate: function () {
            for (var i = 0; i < glowWords.length; i++) {
              var shell = glowWords[i];
              var timing = TIMINGS[shell.dataset.word];
              if (!timing) continue;
              var glyph = shell.firstElementChild;
              var env = envelope(driver.t, timing.start, timing.end);
              glyph.style.textShadow =
                "0 0 " + MAX_BLUR * env + "px rgba(76, 217, 180, " + env * 0.85 + ")";
              glyph.style.color = colorAt(env);
              glyph.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
            }
          },
        },
        0,
      );

      /* resolved: the fan holds still. No camera move, no idle wobble in the
         back half — the long-tail settle on the entry is the last band motion. */

      window.__timelines["02-promise"] = tl;
    })();
  </script>
