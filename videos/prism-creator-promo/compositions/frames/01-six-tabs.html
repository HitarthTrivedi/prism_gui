    <!-- the cue stack -->
    <div class="clip sixtabs-cues" data-start="0" data-duration="6.4" data-track-index="2">
      <div class="sixtabs-cue" id="sixtabs-cue-1">
        <span class="sixtabs-w">your</span> <span class="sixtabs-w">next</span>
        <span class="sixtabs-w">collab</span> <span class="sixtabs-w">video</span>
      </div>

  <script>
    (function () {
      var SCENE_DURATION = 6;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ────────────────────────────────────────────────────────────────
         dynamic-content-sequencing — the cue onsets are PRE-COMPUTED ONCE
         from content length + a per-cue hold, never hand-tuned offsets.
         The resulting starts ARE the single beat grid every element reads.
         ──────────────────────────────────────────────────────────────── */
      var BASE_DURATION = 0.55;
      var SEC_PER_CHAR = 0.028;
      var ENTRY_AT = 0.35;

      var CUES = [
        { id: "sixtabs-cue-1", text: "your next collab video", hold: 0.0 },
        { id: "sixtabs-cue-2", text: "starts with re-explaining", hold: 0.35 },
        { id: "sixtabs-cue-3", text: "everything you already said", hold: 0.3 },
        { id: "sixtabs-cue-4", text: "six times.", hold: 1.3 }
      ];

      var cumulative = ENTRY_AT;
      var CUE_TIMELINE = CUES.map(function (cue) {
        var dur = BASE_DURATION + cue.text.length * SEC_PER_CHAR + cue.hold;
        var start = cumulative;
        cumulative += dur;
        return { id: cue.id, start: start, end: cumulative };
      });
      // one shared onset array — phrases, slabs and chrome all time off it
      var BEATS = CUE_TIMELINE.map(function (entry) {
        return entry.start;
      });

      function wordsOf(cueId) {
        return Array.prototype.slice.call(
          document.querySelectorAll("#" + cueId + " .sixtabs-w")
        );
      }

      /* ── Scene 1 (0.0–1.4s) ─────────────────────────────────────────
         The centre slab settles dead-centre; the context line types on
         behind a blinking caret; cue 1 waterfalls across the top third. */

      // slab entry — self-centering baked into the fromTo, no CSS transform
      tl.fromTo(
        "#sixtabs-slab-chatgpt",
        { xPercent: -50, yPercent: -50, x: 0, y: -52, scale: 0.965, opacity: 0 },
        { x: 0, y: -70, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.02
      );

      // discrete-text-sequence — whole states swapped at thresholds:
      // keystroke clusters → a typo → backspace to the fork → bulk paste.
      var TYPE_START = 0.25;
      var TYPE_DURATION = 1.2;
      var SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.06, text: "so " },
        { t: 0.14, text: "so last " },
        { t: 0.24, text: "so last month I " },
        { t: 0.34, text: "so last month I did a " },
        { t: 0.46, text: "so last month I did a collab wiht" },
        { t: 0.56, text: "so last month I did a collab wi" },
        { t: 0.62, text: "so last month I did a collab with @m" },
        { t: 0.7, text: "so last month I did a collab with @maya, " },
        { t: 0.82, text: "so last month I did a collab with @maya, and the " },
        { t: 1.0, text: "so last month I did a collab with @maya, and the video was about…" }
      ];

      var typedEl = document.getElementById("sixtabs-typed-live");
      var caretEl = document.getElementById("sixtabs-caret");

      function textAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }

      var typeDriver = { t: 0 };
      var lastTyped = null;
      tl.to(
        typeDriver,
        {
          t: TYPE_DURATION,
          duration: TYPE_DURATION,
          ease: "none",
          onUpdate: function () {
            var next = textAt(typeDriver.t);
            if (next !== lastTyped) {
              typedEl.textContent = next;
              lastTyped = next;
            }
          }
        },
        TYPE_START
      );

      // caret blink — deterministic sin square wave on the same timeline
      var blink = { p: 0 };
      var lastBlink = null;
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 8,
          duration: SCENE_DURATION - TYPE_START,
          ease: "none",
          onUpdate: function () {
            var on = Math.sin(blink.p) > 0 ? "1" : "0";
            if (on !== lastBlink) {
              caretEl.style.opacity = on;
              lastBlink = on;
            }
          }
        },
        TYPE_START
      );

      // cue 1 — waterfall entry: per-word x-cascade with SHRINKING gaps
      var gap1 = 0.055;
      var at1 = BEATS[0];
      wordsOf("sixtabs-cue-1").forEach(function (word) {
        tl.fromTo(
          word,
          { x: 180, opacity: 0.3 },
          { x: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
          at1
        );
        at1 += gap1;
        gap1 *= 0.84;
      });

      /* ── Scene 2 (1.4–3.0s) ─────────────────────────────────────────
         Cue 2 lands beneath cue 1; two more slabs arrive on receding
         z-planes, each already carrying the SAME typed line at reduced
         opacity — the repetition is the read. The depth falloff itself
         (scale / opacity / blur) is a fixed style, not a move. */

      wordsOf("sixtabs-cue-2").forEach(function (word, i) {
        tl.fromTo(
          word,
          { y: 54, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.42, ease: "expo.out" },
          BEATS[1] + i * 0.05
        );
      });

      ["#sixtabs-slab-claude", "#sixtabs-slab-perplexity"].forEach(function (sel, i) {
        var el = document.querySelector(sel);
        var tx = Number(el.dataset.targetX);
        var ty = Number(el.dataset.targetY);
        var depthScale = Number(el.dataset.depthScale);
        var depthOpacity = Number(el.dataset.depthOpacity);
        tl.fromTo(
          el,
          {
            xPercent: -50,
            yPercent: -50,
            x: tx,
            y: ty + 46,
            scale: depthScale * 0.94,
            opacity: 0
          },
          {
            x: tx,
            y: ty,
            scale: depthScale,
            opacity: depthOpacity,
            duration: 0.72,
            ease: "power3.out"
          },
          BEATS[1] + 0.1 + i * 0.18
        );
      });

      /* ── Scene 3 (3.0–4.6s) ─────────────────────────────────────────
         Cue 3, then center-outward-expansion run INWARD: three slabs
         drive in from the left, right and bottom edges to their targets,
         closing the gutters until the centre slab is boxed in.
         Out-easing only, staggered by index. */

      var gap3 = 0.05;
      var at3 = BEATS[2];
      wordsOf("sixtabs-cue-3").forEach(function (word) {
        tl.fromTo(
          word,
          { x: -160, opacity: 0.25 },
          { x: 0, opacity: 1, duration: 0.5, ease: "circ.out" },
          at3
        );
        at3 += gap3;
        gap3 *= 0.84;
      });

      var INWARD_DUR = 0.85;
      var INWARD_STAGGER = 0.12;
      Array.prototype.slice
        .call(document.querySelectorAll(".sixtabs-burst"))
        .forEach(function (el, i) {
          tl.fromTo(
            el,
            {
              xPercent: -50,
              yPercent: -50,
              x: Number(el.dataset.fromX),
              y: Number(el.dataset.fromY),
              scale: 1.06,
              opacity: 0
            },
            {
              x: Number(el.dataset.targetX),
              y: Number(el.dataset.targetY),
              scale: 1,
              opacity: 1,
              duration: INWARD_DUR,
              ease: "power3.out"
            },
            BEATS[2] + 0.16 + i * INWARD_STAGGER
          );
        });

      /* ── mono chrome — the tally ticks up as each tab lands ────────── */
      var TALLY = [
        { t: 0.4, text: "tabs 01" },
        { t: 1.95, text: "tabs 02" },
        { t: 2.15, text: "tabs 03" },
        { t: 3.75, text: "tabs 04" },
        { t: 3.9, text: "tabs 05" },
        { t: 4.05, text: "tabs 06" }
      ];
      var tallyEl = document.getElementById("sixtabs-tally");
      var lastTally = null;
      var tallyDriver = { t: 0 };
      tl.to(
        tallyDriver,
        {
          t: SCENE_DURATION,
          duration: SCENE_DURATION,
          ease: "none",
          onUpdate: function () {
            var value = TALLY[0].text;
            for (var i = TALLY.length - 1; i >= 0; i--) {
              if (tallyDriver.t >= TALLY[i].t) {
                value = TALLY[i].text;
                break;
              }
            }
            if (value !== lastTally) {
              tallyEl.textContent = value;
              lastTally = value;
            }
          }
        },
        0
      );
      tl.fromTo(tallyEl, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.4);

      /* ── Scene 4 (4.6–6.0s) ─────────────────────────────────────────
         kinetic-beat-slam: "six times." hits the one remaining gap in
         teal, ~6× the slab-label size, on the shared beat grid. */

      tl.fromTo(
        "#sixtabs-cue-4",
        { scale: 1.55, filter: "blur(14px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
        BEATS[3]
      );

      /* ── sine-wave-loop at the LOW end — subtle jitter keeps the
         crowded frame alive under the held slam. Applied to the crowd
         wrapper only, which nothing else transforms. No drift, no push. */
      var crowd = document.getElementById("sixtabs-crowd");
      var IDLE_START = BEATS[3] + 0.43;
      var IDLE_DUR = SCENE_DURATION - IDLE_START;
      var jitter = { p: 0 };
      tl.to(
        jitter,
        {
          p: Math.PI * 2 * 1.5,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var y = Math.sin(jitter.p) * 2.5;
            var x = Math.sin(jitter.p * 1.7 + Math.PI / 2) * 1.8;
            crowd.style.transform = "translate(" + x.toFixed(3) + "px," + y.toFixed(3) + "px)";
          }
        },
        IDLE_START
      );

      // full-span anchor so the sub-composition timeline covers the shot
      tl.to({}, { duration: SCENE_DURATION }, 0);

      window.__timelines["01-six-tabs"] = tl;
    })();
  </script>
