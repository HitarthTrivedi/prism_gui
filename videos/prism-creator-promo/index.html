<!doctype html>

        height: 1920px;
        overflow: hidden;
        background: #F2F2F3;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-six-tabs", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 6);
        tl.fromTo("#el-02-promise", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 6);
        tl.to("#el-02-promise", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-03-attach", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.to("#el-03-attach", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.fromTo("#el-04-refract", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.to("#el-04-refract", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 28);
        tl.fromTo("#el-05-real-plan", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 28);

        tl.fromTo("#el-08-your-chrome", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 50);
        tl.to("#el-08-your-chrome", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 56);
        tl.fromTo("#el-09-outro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 56);
        tl.to({}, { duration: 61 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
