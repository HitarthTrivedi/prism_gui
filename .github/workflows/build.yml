name: Build desktop apps

# PyInstaller cannot cross-compile, so each OS is built on its own runner.
# Push a tag (v1.0.0) to publish a release; anything else just leaves the
# artifacts attached to the run for testing.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only by the release job

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # a broken macOS build shouldn't hide a good Windows one
      matrix:
        include:
          - os: ubuntu-22.04     # oldest supported glibc — newer ones can't run
            label: Linux (x64)   # binaries built against a newer libc
          - os: windows-latest
            label: Windows (x64)
          - os: macos-14         # Apple Silicon
            label: macOS (Apple Silicon)
          # No Intel Mac target. macos-15-intel built fine but failed its smoke
          # test, and `release` needs the whole matrix — one red leg blocks the
          # publish for every platform. Dropped rather than debugged, because
          # the machines this is going to are Apple Silicon.
          #
          # An arm64 .dmg will NOT run on an Intel Mac: there is no Rosetta path
          # for it, the app simply won't open. If one ever needs supporting, add
          # `- os: macos-15-intel` back here (GitHub offers that image until
          # Aug 2027) and fix the smoke-test failure it surfaces.

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # prism_terminal is a submodule; without this
                                  # the engine is an empty directory

      # git's message for this ("not our ref <sha>") cost a debugging session
      # once already — if checkout dies, say what it almost certainly means.
      - name: Explain checkout failures
        if: failure()
        run: |
          echo "::error::Checkout failed. Most likely cause: prism_gui pins the \
          prism_terminal submodule to a commit that was never pushed. Run \
          'cd prism_terminal && git push origin HEAD:main' locally, then re-run."

      - uses: actions/setup-python@v5
        with:
          # 3.12, deliberately: 3.13 removed the stdlib audioop that the wake
          # word uses, and PySide6 wheels lag the newest release.
          python-version: "3.12"
          cache: pip

      - name: Install Qt's runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 \
            portaudio19-dev libfuse2 xvfb

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements-build.txt

      # PyAudio needs PortAudio headers and has no wheel on some platforms;
      # the app runs without it (voice input just reports itself unavailable),
      # so a failure here must not fail the build.
      - name: Install PyAudio (optional)
        continue-on-error: true
        run: pip install pyaudio

      - name: Fetch appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo curl -sSLo /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build
        env:
          # Which licence server this build talks to. A frozen app ignores
          # PRISM_LICENSE_SERVER at runtime (that override would be a bypass),
          # so the URL is compiled in here.
          #
          # Set the repository variable PRISM_SERVER_URL to aim a build at
          # staging or a team-test server. Leave it unset for real releases and
          # the DEFAULT_SERVER in licensing/client.py ships. A repo *variable*,
          # not a secret — it is a public URL, and secrets are masked in logs
          # which makes a wrong one impossible to diagnose.
          PRISM_SERVER_URL: ${{ vars.PRISM_SERVER_URL }}
        run: python packaging/build.py --clean

      # Proves the bundle actually starts: imports resolve, Qt loads, the
      # window builds. A build that merely *completes* still fails at launch
      # if a hidden import was missed, and that is the failure users see.
      - name: Smoke-test the bundle
        run: python packaging/smoke_test.py

      # Unsigned, on purpose — see devtools/sign_manifest.py's docstring.
      # CI produces the (public, harmless) file list + hashes; the ACTUAL
      # trust decision (signing it) only ever happens on a human's offline
      # machine, never here. update-research-inapp-download.md §5.2
      # requirement #2 is what this step must never violate: nothing that
      # touches this workflow's secrets can also produce a valid update
      # signature.
      #
      # `platform_tag` mirrors updater.py's own platform_tag() (same
      # os-arch string it uses to build the URLs it fetches) so the human
      # signing this knows which of the three unsigned manifests in the
      # release corresponds to which client platform.
      - name: Generate the (unsigned) update manifest
        shell: bash
        run: |
          set -e
          PLATFORM_TAG=$(python -c "import sys; sys.path.insert(0, '.'); import updater; print(updater.platform_tag())")
          VERSION=$(python -c "import sys; sys.path.insert(0, '.'); import app_meta; print(app_meta.VERSION)")
          ARCHIVE=$(ls dist/*.tar.gz dist/*.zip dist/*.dmg 2>/dev/null | head -1)
          python packaging/manifest.py dist/Prism "$VERSION" \
            -o "dist/manifest.${PLATFORM_TAG}.unsigned.json" \
            --archive "$ARCHIVE"
          echo "PLATFORM_TAG=${PLATFORM_TAG}" >> "$GITHUB_ENV"

      # Flattened per-file copies, named exactly how updater.py's
      # _file_url() expects to fetch them (<platform>__<path with / as __>)
      # — this is what makes the file-level diff (update-research.md §1/§3)
      # possible: a code-only release only needs the handful of files that
      # actually changed uploaded/downloaded, not the whole archive again.
      - name: Flatten update assets for hosting
        shell: bash
        run: |
          set -e
          python packaging/flatten_update_assets.py dist/Prism dist/update-assets "$PLATFORM_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: prism-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/manifest.*.unsigned.json
          if-no-files-found: error
          retention-days: 14

      # Deliberately NAMED WITHOUT THE "prism-" PREFIX, and deliberately a
      # separate artifact from the one above: the `release` job below only
      # downloads artifacts matching `prism-*`, so these thousands of small
      # per-file assets are never swept into `artifacts/**/*` and published
      # automatically. They stay a plain 14-day workflow artifact until a
      # human runs the signing step and publishes them by hand — see
      # RELEASING-UPDATES.md. (Getting this naming wrong would mean every
      # tagged push silently attaches ~1300+ unsigned files per platform to
      # a public release — check this if you ever touch the naming here.)
      - uses: actions/upload-artifact@v4
        with:
          name: update-assets-${{ matrix.os }}
          path: dist/update-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # `pattern: prism-*` deliberately excludes the `update-assets-*`
      # artifacts (see their upload step's comment) — this release gets the
      # archives + unsigned manifests only. Nothing update-related that a
      # client could fetch and run is published here automatically; that is
      # a separate, human-run step. See RELEASING-UPDATES.md.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: prism-*
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            **New here?** [GETTING_STARTED.md](https://github.com/${{ github.repository }}/blob/main/GETTING_STARTED.md)
            has the full walkthrough — which file to pick, first launch, first run.

            Quick version: builds are unsigned, so the OS warns on first launch.
            **macOS**: right-click Prism.app → Open → Open. Or, if macOS says
            the app "is damaged", clear the quarantine flag:
            `xattr -dr com.apple.quarantine /Applications/Prism.app`
            **Windows**: SmartScreen → More info → Run anyway.
            **Linux**: `chmod +x` the AppImage, or extract the tarball and run
            `./install.sh`.

            Prism drives **Google Chrome**, which must be installed separately.

            ---
            _In-app update assets (`manifest.*.unsigned.json` above, plus the
            `update-assets-*` workflow artifacts on this run) are unsigned and
            not yet usable by the app's updater. See RELEASING-UPDATES.md for
            the one remaining manual step (sign + publish) before this
            release is fetchable by Prism's in-app updater._
