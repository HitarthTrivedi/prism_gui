# One invocation, everywhere: `python -m pytest`.
#
# The suite used to need a remembered incantation — a --deselect for a test
# that hung rather than failed, and a warning never to export
# PRISM_LICENSE_OFFLINE_DEV. Both are gone (the hang was a modal leaking out
# of an unclosed dialog, fixed at source), and this file exists so the
# remaining setup lives with the project instead of in a README paragraph
# and three people's shell history.
#
# Deliberately NOT here: PRISM_LICENSE_OFFLINE_DEV. It opens a production
# bypass underneath the revocation test — `licensing._offline_dev()` is read
# inside `_unreachable_answer()`, so it changes the ANSWER a revoked licence
# gets, and the one assertion that must never be unreliable starts passing
# for the wrong reason. tests/conftest.py strips it per test; nothing may
# put it back.

[pytest]
testpaths = tests

# -q keeps the output readable; -r sS reports SKIPS WITH THEIR REASONS.
# That second part is the point: ~22 tests skip because a real-customer job
# folder only exists on one developer's Mac, and as a bare 's' nobody ever
# saw them go. A skip that hides its reason is how a whole add-on's tests
# stopped running without anyone noticing.
addopts = -q -r sS

# Nothing plugin-dependent lives here on purpose. `env = …` and `timeout =
# …` were both written here first and both were INERT: they need pytest-env
# and pytest-timeout, which are not installed, so pytest warned "Unknown
# config option" and carried on with neither in force. A setting that looks
# applied and is not is worse than no setting — QT_QPA_PLATFORM is set in
# tests/conftest.py instead, where nothing can be missing, and the CI job
# installs pytest-timeout and passes --timeout on the command line.

filterwarnings =
    # audioop is gone in 3.13 and wakeword.py already falls back to
    # audioop-lts; the warning is noise on 3.11/3.12, not a finding.
    ignore:'audioop' is deprecated:DeprecationWarning
